[package]
name = "nice-tuner"
version = "0.1.0"
edition = "2024"
description = "A stringed-instrument tuner plugin with a frost-derived embedded GUI"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# The `lib` artifact is needed for the standalone target
crate-type = ["cdylib", "lib"]

[[bin]]
# Must NOT equal the lib target name: on MSVC the linker writes a
# `<name>.pdb` per artifact into target/<profile>/deps/, so a cdylib and an
# exe sharing the base name collide ("output file collision" on
# nice_tuner.pdb). macOS hides this (lib-prefixed dylib, embedded DWARF).
name = "nice-tuner-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = []
# Builds the standalone app binary (src/main.rs). Kept out of the default set
# so the plugin (cdylib) builds do not pull in cpal/jack/midir.
standalone = ["nice-plug/standalone", "dep:cpal", "dep:windows-sys", "dep:raw-window-handle"]
# Windows only (a no-op elsewhere; nice-plug gates all ASIO code on
# target_os = "windows"). Compiles cpal's ASIO host into the standalone
# binary and adds the `--backend asio` option. Without it, `--backend asio`
# is not even a recognized value. Implies `standalone`.
standalone-asio = ["standalone", "nice-plug/standalone-asio", "asio-host"]
# cfg-visible alias for cpal/asio (cfg cannot test "cpal/asio" directly);
# drives the ASIO arms in src/devices.rs.
asio-host = ["cpal/asio", "dep:asio-sys"]

[dependencies]
nice-plug = { version = "0.4.2", default-features = false, features = [
    "editor",
    "vst3",
    "tracing-subscriber",
    # Debug-build guard: fails loudly if `process()` allocates.
    "assert_process_allocs",
] }
# Pinned to what nice-plug 0.4.2's byo_gui_wgpu example was built against.
# NOTE: baseview 0.3.7+ moved the WindowHandler trait; nice-plug `main` already
# tracks baseview 0.4.1 — revisit this pin when nice-plug releases again.
baseview = { version = "=0.3.3", features = ["tracing"] }
wgpu = "30"
pollster = "0.4"
crossbeam = "0.8"
# baseview 0.3.3 does not re-export it; its Event::Keyboard carries this type
keyboard-types = "0.8.3"
# Settings panel persistence (main thread only; never touched by the audio path)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direct cpal dependency for device enumeration in the settings panel
# (standalone only). Same version nice-plug resolves to; features are
# additive on the unified dependency graph.
cpal = { version = "0.18", optional = true }
pitch = { path = "crates/pitch" }
# RT↔UI analysis handoff (audio thread: producer; editor frame: consumer).
# Already in the graph via nice-plug standalone; version-matched here.
rtrb = "0.4"
# M3: frost fork (embedded renderer, winit run loop + rodio removed)
frost = { path = "vendor/frost" }

# Standalone top-level window geometry (position restore/centering):
# baseview 0.3.3 has no position API, so the Windows build reaches for
# SetWindowPos/GetWindowRect directly. Compiles only on Windows, only for
# the standalone build (the target table drops it elsewhere).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
# baseview 0.3.3 speaks raw-window-handle 0.6; same version required to
# read its PlatformHandle's HWND.
raw-window-handle = { version = "0.6", optional = true }
# Direct ASIO access (same version cpal 0.18 pins): reading a driver's
# PREFERRED buffer size — which cpal discards — in the streamless child
# (--list-devices). Sequential with cpal's use; never concurrent.
asio-sys = { version = "0.4", optional = true }

[workspace]
members = ["xtask", "crates/pitch", "vendor/frost"]

# Dev-profile analysis cost: detection is bursty (one window-search per ~85 ms
# of audio) and runs in the editor's frost-frame pump — the nice-plug main/UI
# thread, in host and standalone alike. At opt-level 0 a burst measures
# ~2.3 ms, enough to stutter a 60 fps frame loop; opt-level 3 brings it to
# ~0.26 ms. (It no longer threatens audio: analysis left the RT thread — see
# lib.rs.) Regression guard: crates/pitch/tests/callback_budget.rs.
[profile.dev.package.pitch]
opt-level = 3
